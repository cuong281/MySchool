# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/GradeDB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JWT Configuration (configurable via environment variable JWT_SECRET)
jwt.secret=${JWT_SECRET:MySchoolSecretKeyForJwtAuthenticationSpringSecurity6Project2026SecureKey!}
jwt.access-token-expiration-ms=7200000
jwt.refresh-token-expiration-ms=604800000

# CORS Configuration (comma-separated list of allowed origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:5173}

# Production Error Configuration
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Production Logging Configuration
logging.level.com.jetbrains.grade=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
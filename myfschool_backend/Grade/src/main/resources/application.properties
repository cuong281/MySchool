spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GradeDB;encrypt=false;trustServerCertificate=true;characterEncoding=UTF-8
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


spring.sql.init.mode=never

server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JWT Configuration (configurable via environment variable JWT_SECRET)
jwt.secret=${JWT_SECRET:MySchoolSecretKeyForJwtAuthenticationSpringSecurity6Project2026SecureKey!}
jwt.access-token-expiration-ms=7200000
jwt.refresh-token-expiration-ms=604800000


server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always
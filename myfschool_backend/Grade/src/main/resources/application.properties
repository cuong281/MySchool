# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/GradeDB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JWT Configuration (configurable via environment variable JWT_SECRET)
jwt.secret=${JWT_SECRET:MySchoolSecretKeyForJwtAuthenticationSpringSecurity6Project2026SecureKey!}
jwt.access-token-expiration-ms=7200000
jwt.refresh-token-expiration-ms=604800000


server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always
services:
  mysql:
    image: mysql:8.0
    container_name: grade-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=GradeDB
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # TỐI ƯU SIÊU TIẾT KIỆM RAM (Từ ~600MB xuống chỉ còn ~130MB RAM)
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --performance_schema=OFF
      - --innodb_buffer_pool_size=64M
      - --innodb_log_buffer_size=8M
      - --max_connections=50
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - grade-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grade-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/GradeDB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_FLYWAY_ENABLED=true
      # Giới hạn RAM tối đa cho Spring Boot là 256MB để không tràn RAM VPS
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
    networks:
      - grade-network

volumes:
  mysql_data:
    driver: local

networks:
  grade-network:
    driver: bridge
